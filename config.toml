baseURL = 'http://gorkembuzcu.com.tr/'
locale = 'en-us'
title = 'Titles are overrated'
theme = 'ananke'
resourceDir = "../resources"

DefaultContentLanguage = "en"
SectionPagesMenu = "main"
enableRobotsTXT = true

[languages]
  [languages.en]
    title = "Gorkem's Homepage"
    weight = 1
    contentDir = "content/en"
    # languageDirection = 'rtl' for Right-To-Left languages
  [languages.tr]
    title = "Gorkem'in Blogu"
    weight = 2
    contentDir = "content/tr"
  [languages.nl]
    title = "Gorkem's Blogje"
    weight = 2
    contentDir = "content/nl"

[pagination]
  pagerSize = 3 # this is set low for demonstrating with dummy content. Set to a higher number

[sitemap]
  changefreq = "monthly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  text_color = ""
  author = ""
  favicon = ""
  site_logo = ""
  description = "I wish this was a travel blog"
  background_color_class = "bg-black"
  recent_posts_number = 3

[params.ananke.social.follow]
  networks = ["twitter"]

[params.ananke.social.twitter]
  username = "buzcug"
